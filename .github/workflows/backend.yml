name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'scripts/check-toolchain-sync.sh'
      - 'scripts/e2e/**'
      - 'infra/postgres/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'scripts/check-toolchain-sync.sh'
      - 'scripts/e2e/**'
      - 'infra/postgres/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, Clippy, Test & Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # A disposable PostGIS server for the database tests (same image line as production).
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check toolchain pins are consistent
        working-directory: .
        run: bash scripts/check-toolchain-sync.sh

      # Keep this version in sync with backend/rust-toolchain.toml and backend/Dockerfile.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: backend

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # --all-features turns on db-tests: migrations, constraints and role checks against real PostGIS.
      - name: Run Unit & Integration Tests
        run: cargo test --locked --workspace --all-features

      # Replays the attacks reproduced during the audit against the real binary, in production mode, on a
      # database prepared like the compose stack does (owner role migrates, `baze_app` serves).
      - name: Replay the audit attacks against the real server
        working-directory: .
        run: |
          (cd backend && cargo build --locked -p baze-app --bin baze-server)
          url="$(bash scripts/e2e/prepare-db.sh "$DATABASE_URL" baze_e2e)"
          python3 scripts/e2e/audit_regression.py --database-url "$url" --admin-database-url "$DATABASE_URL" --through 11

      - name: Check the OpenAPI contract is up to date
        run: cargo run --locked -p baze-app --bin export-openapi -- --check

      - name: Install cargo-deny
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-deny@0.20.2

      # Advisories are checked by .github/workflows/security.yml (weekly and on demand) so that
      # a newly published advisory cannot block unrelated pull requests.
      - name: Run cargo-deny checks
        run: cargo deny check bans licenses sources

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: backend

      # The explicit +1.88.0 overrides backend/rust-toolchain.toml.
      - name: Check that the workspace builds on the minimum supported Rust version
        run: cargo +1.88.0 check --locked --workspace --all-targets
