[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Gabriel Piñones"]
repository = "https://github.com/kripiman/Baze"

[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/shared",
    "crates/auth",
    "crates/hazards",
    "crates/routing",
    "crates/geocoding",
    "crates/realtime",
]

[workspace.dependencies]
shared = { path = "crates/shared" }
auth = { path = "crates/auth" }
hazards = { path = "crates/hazards" }
routing = { path = "crates/routing" }
geocoding = { path = "crates/geocoding" }
realtime = { path = "crates/realtime" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid", "repr"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
uuid = { version = "1.14", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0"
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ipnet = "2.12"
