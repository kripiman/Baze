# Schema of cargo-deny >= 0.19. CI pins the exact version (see .github/workflows/backend.yml);
# when bumping it, run `cargo deny check` locally first.

[advisories]
# Security vulnerabilities always fail the check; there is no key for it in this schema.
# Check only the crates that end up in our own dependency tree, and fail on yanked releases.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
# The allow-list is a policy, not an inventory of what is currently in use.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other through `path` only (they are `publish = false`).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
