[package]
name = "baze-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "baze_app"
path = "src/lib.rs"

[[bin]]
name = "baze-server"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[features]
# Tests that need a PostgreSQL + PostGIS server reachable through DATABASE_URL (the role must be
# allowed to create databases: sqlx::test makes one per test). CI provides one; see CONTRIBUTING.md.
db-tests = []

[dependencies]
shared.workspace = true
auth.workspace = true
hazards.workspace = true
routing.workspace = true
geocoding.workspace = true
realtime.workspace = true

axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
ipnet.workspace = true
url.workspace = true
hyper.workspace = true
hyper-util.workspace = true
async-trait.workspace = true

[dev-dependencies]
hex.workspace = true
hmac.workspace = true
http-body-util.workspace = true
sha2.workspace = true
