name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

# A newer push supersedes the run in progress for the same ref.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test, Assemble & Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # setup-gradle validates the checksum of gradle-wrapper.jar before running anything.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # One invocation with --continue, so a single run reports every failing task, not only the first.
      # checkPurity: the core modules stay free of java.*/android.* (AGENTS §6.2).
      # assembleRelease: R8 and resource shrinking, which is where missing keep rules show up.
      # checkLicenses: every dependency of the release APK has an approved license.
      - name: Lint, test, assemble and check licenses
        run: ./gradlew lint test checkPurity assembleDebug assembleRelease checkLicenses --continue --stacktrace
